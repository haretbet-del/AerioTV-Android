name: Compile My TV Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Full Repair and Configure SDK
        run: |
          git checkout origin/main -- .
          mkdir -p $HOME/android-sdk/licenses
          echo -e "24333f1a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n893a316ab96535af5455b3c2488e8433b86e7717" > $HOME/android-sdk/licenses/android-sdk-license
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Build TV Player APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AerioTV-Ru-Categories
          path: "**/build/outputs/apk/**/*.apk"
