name: Compile My TV Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Full Repair and Configure SDK
        run: |
          git checkout origin/main -- .
          mkdir -p $HOME/android-sdk/licenses
          echo -e "24333f1a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/android-sdk/licenses/android-sdk-license
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Discover Real Project Structure
        run: |
          chmod +x gradlew
          ./gradlew projects --no-daemon
